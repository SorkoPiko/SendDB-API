[package]
name = "SendDB-API"
version = "1.0.0"
edition = "2024"

[dependencies]
tokio = "1.49.0"
actix-web = "4.12.1"
actix-cors = "0.7.1"
actix-governor = "0.10.0"
utoipa = { version = "5.4.0", features = ["actix_extras"] }
utoipa-actix-web = "0.1.2"
utoipa-swagger-ui = { version = "9.0.2", features = ["actix-web"] }
serde = { version = "1.0.228", features = ["derive"] }
dotenvy = "0.15.7"
mongodb = "3.5.0"
async-trait = "0.1.89"
anyhow = "1.0.100"
log = "0.4.29"
bson = { version = "3.1.0", features = ["serde"] }
futures = "0.3.31"
serde_json = "1.0.149"
fern = "0.7.1"
chrono = "0.4.43"
regex = "1.12.3"
fuzzy-matcher = "0.3.7"
